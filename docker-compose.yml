version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: costra_postgres
    restart: always
    environment:
      POSTGRES_USER: costra
      POSTGRES_PASSWORD: costra_dev_password
      POSTGRES_DB: costra
    ports:
      - "5432:5432"
    volumes:
      - costra_pgdata:/var/lib/postgresql/data

volumes:
  costra_pgdata:
